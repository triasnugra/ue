<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Engine</title>
<style>:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--ln:#ddd;--g:#0a7d3c;--r:#b3261e}@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#9a9a9a;--ln:#333;--g:#4cc27f;--r:#ff7b72}}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1100px;margin:auto}h1{font-size:18px}h2{font-size:15px;margin-top:24px}.k{display:flex;gap:12px;flex-wrap:wrap}.k div{border:1px solid var(--ln);padding:8px 12px;border-radius:6px}.k b{display:block;font-size:18px}
label{margin-right:12px;color:var(--mut)}input{width:90px;padding:4px;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:4px}.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}.L{color:var(--g)}.S{color:var(--r)}small{color:var(--mut)}</style></head><body>
<h1>Unified Engine <small id="m"></small></h1><div class="k" id="k"></div><p><label>Ekuitas $ <input id="eq" type="number" value="1000" min="0" step="100"></label><label>Risiko % <input id="rk" type="number" value="0.25" min="0" step="0.05"></label></p>
<p><small id="n"></small></p><h2>Corong filter <small>(koin gugur di tahap mana)</small></h2><div class="k" id="f"></div><div class="w"><table><thead><tr><th>Waktu</th><th>Koin</th><th>Arah</th><th>Entry</th><th>SL</th><th>TP</th><th>Qty</th><th>Alasan</th><th>Status</th><th>R net</th></tr></thead><tbody id="b"></tbody></table></div><p id="e"></p>
<h2>Watchlist <small>(arah dan level sudah valid, tetapi entry masih terlalu jauh; pantau, belum boleh dieksekusi)</small></h2><div class="w"><table><thead><tr><th>Koin</th><th>Arah</th><th>Level entry</th><th>Harga</th><th>Jarak (ATR)</th><th>Alasan</th></tr></thead><tbody id="wl"></tbody></table></div>
<h2>Status per koin</h2><div class="w"><table><thead><tr><th>Koin</th><th>Harga</th><th>Tren</th><th>Posisi range</th><th>Status</th></tr></thead><tbody id="cn"></tbody></table></div>
<script>
// Nonaktifkan scroll mouse pada semua input numerik: fokus dilepas sebelum nilai berubah, halaman tetap bisa di-scroll.
document.addEventListener('wheel',e=>{const a=document.activeElement;if(a&&a.type==='number')a.blur()},{passive:true});
const f=(v,d=4)=>v==null?'-':Number(v).toPrecision(d),$=id=>document.getElementById(id);let S=null;
function draw(){if(!S)return;const eq=+$('eq').value||0,rk=+$('rk').value||0;$('b').innerHTML=S.setups.map(s=>{const q=eq*rk/100/Math.abs(s.entry-s.sl);return`<tr><td>${new Date(s.decision_ms).toISOString().slice(0,10)}</td><td>${s.symbol}</td><td class="${s.side[0]}">${s.side}</td><td>${f(s.entry)}</td><td>${f(s.sl)}</td><td>${f(s.tp)}</td><td>${f(q,3)}</td><td>${s.why}</td><td>${s.status}${s.reason?' <small>'+s.reason+'</small>':''}</td><td>${s.R_net==null?'-':s.R_net.toFixed(2)}</td></tr>`}).join('')}
fetch('data/state.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{S=d;const t=d.stats;$('m').textContent='UI v2 | mesin v'+(d.meta.version||'?')+' | scan terakhir '+(d.meta.last_scan_utc||'-')+' UTC | universe '+(d.meta.universe||0)+' koin';
$('k').innerHTML=[['Terbit',t.published],['Selesai',t.resolved],['TP/SL',t.tp+'/'+t.sl],['Expired',t.expired],['Win rate',t.win_rate==null?'-':(t.win_rate*100).toFixed(1)+'%'],['Exp. R net',t.expectancy_R_net==null?'-':t.expectancy_R_net.toFixed(2)],['Rantai jurnal',t.chain_ok?'OK':'RUSAK']].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('n').textContent=t.note;draw();more(d)}).catch(()=>$('n').textContent='Belum ada data. Jalankan workflow dulu.');
const LB={SETUP:'Setup terbit',NO_TRIGGER:'Belum ada pemicu',MID_RANGE:'Tengah range: no trade',FLAT:'Harga datar',COUNTER_TREND:'Melawan tren: diblokir',LOW_CONFIRMATION:'Konfirmasi kurang',ENTRY_TOO_FAR:'Entry terlalu jauh',TP_ALREADY_PASSED:'TP sudah terlewati',SL_TOO_WIDE:'SL terlalu lebar',DATA_SHORT:'Data kurang',NO_DATA:'Data gagal',NO_OPEN_CANDLE:'Candle hari ini tidak ada'};
function more(d){const m=d.meta,fn=m.funnel||{};$('f').innerHTML=Object.entries(fn).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><small>${LB[k]||k}</small><b>${v}</b></div>`).join('');
$('e').innerHTML=d.setups.length?'':'<small>Tidak ada setup aktif. Itu hasil yang sah: mesin hanya menerbitkan bila semua filter lolos. Lihat corong di atas untuk alasannya.</small>';
$('wl').innerHTML=(m.watchlist||[]).map(w=>`<tr><td>${w.symbol}</td><td class="${w.side[0]}">${w.side}</td><td>${f(w.level)}</td><td>${f(w.px)}</td><td>${w.dist_atr.toFixed(2)}</td><td>${w.why}</td></tr>`).join('')||'<tr><td colspan=6><small>Kosong</small></td></tr>';
$('cn').innerHTML=(m.coins||[]).map(c=>`<tr><td>${c.symbol}</td><td>${f(c.px)}</td><td>${c.tr==null?'-':c.tr>0?'Naik':c.tr<0?'Turun':'Netral'}</td><td>${c.pos==null?'-':(c.pos*100).toFixed(0)+'%'}</td><td>${LB[c.state]||c.state}</td></tr>`).join('')}
$('eq').addEventListener('input',draw);$('rk').addEventListener('input',draw);
</script></body></html>
