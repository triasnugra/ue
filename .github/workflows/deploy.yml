name: Analisis dan Deploy
on:
  schedule:
    - cron: "7 0 * * *"      # scan harian setelah open 00:00 UTC (+ evaluasi)
    - cron: "37 * * * *"     # evaluasi tiap jam
  workflow_dispatch: {}
concurrency: { group: engine, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .          # gagal tes = berhenti
      - run: python -m scripts.run --mode auto
      - name: Simpan jurnal dan state
        run: |
          git config user.name "engine-bot"; git config user.email "bot@users.noreply.github.com"
          git add data web/data && (git diff --cached --quiet || git commit -m "data: update $(date -u +%FT%TZ)") && git pull --rebase && git push || true
      - name: Snapshot web (hanya web/, bukan output backtest)
        run: mkdir _site && cp -r web/. _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
